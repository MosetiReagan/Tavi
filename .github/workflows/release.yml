name: Tavi Release v1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode Release Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "keystore_path=${{ runner.temp }}/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded successfully."
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret provided; building with default signing configuration."
          fi

      - name: Build Release APK & AAB
        env:
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | sort | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-output/Tavi-v1.0.0.apk
            echo "Release APK copied to release-output/Tavi-v1.0.0.apk"
          else
            echo "Error: No release APK found!"
            exit 1
          fi

          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" release-output/Tavi-v1.0.0.aab
            echo "Release AAB copied to release-output/Tavi-v1.0.0.aab"
          fi

          cd release-output
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tavi-v1.0.0-release-bundle
          path: release-output/*

      - name: Extract Changelog Entry
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n '/## \[1.0.0\]/,/## \[/p' CHANGELOG.md | sed '$d' > release-notes.md
            echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: release-output/Tavi-v1.0.0.apk
          generate_release_notes: true
          draft: false
          prerelease: false
