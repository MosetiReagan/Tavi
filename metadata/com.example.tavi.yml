Summary: 100% Private, On-Device AI Assistant with Gemma 4 E2B and Native Android Tools

Description: |
  Tavi is a fully local, on-device AI assistant designed for Android. It operates
  without sending telemetry, user queries, or personal memories to any remote cloud servers.

  Features:
  - 100% On-Device Neural Inference: Powered by Google AI Edge LiteRT-LM running Gemma 4 E2B / Gemma 3 1B IT.
  - 57 Native Tools: Calendar, Clock/Alarms, SMS, Contacts, Flashlight, Notes, Battery, SAF Storage, and Screen Navigation.
  - Continuous Hands-Free Voice: Follow-up conversational loop with barge-in interruption.
  - Screen Agent Mode: Accessibility-driven automated assistance with strict privacy and consequential action gates.
  - Zero Cloud Dependency: Completely functional offline without accounts or subscriptions.

